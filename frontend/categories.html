<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally Timing - Categorias</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="container">
        <div class="page-header">
            <h1>Categorias</h1>
            <button class="btn btn-primary" onclick="openModal()">+ Agregar Categoria</button>
        </div>

        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripcion</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="categories-table">
                        <tr><td colspan="3" class="empty-state">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="category-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Agregar Categoria</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="category-form" onsubmit="saveCategory(event)">
                <input type="hidden" id="category-id">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="cat-name" required placeholder="Ej: N, A, R, WRC, Libre...">
                </div>
                <div class="form-group">
                    <label>Descripcion</label>
                    <textarea id="cat-description" placeholder="Descripcion de la categoria..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
