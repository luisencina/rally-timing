<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally Timing - Pilotos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="container">
        <div class="page-header">
            <h1>Pilotos</h1>
            <button class="btn btn-primary" onclick="openModal()">+ Agregar Piloto</button>
        </div>

        <div class="card">
            <div class="form-group" style="margin-bottom:1rem;">
                <input type="text" id="search-input" placeholder="Buscar piloto..." oninput="loadPilots()">
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apodo</th>
                            <th>Telefono</th>
                            <th>Licencia</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="pilots-table">
                        <tr><td colspan="5" class="empty-state">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="pilot-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Agregar Piloto</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="pilot-form" onsubmit="savePilot(event)">
                <input type="hidden" id="pilot-id">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" id="first_name" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido *</label>
                        <input type="text" id="last_name" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Apodo</label>
                        <input type="text" id="nickname">
                    </div>
                    <div class="form-group">
                        <label>Telefono</label>
                        <input type="text" id="phone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-group">
                        <label>Nro. Licencia</label>
                        <input type="text" id="license_number">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notas</label>
                    <textarea id="notes"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pilots.js"></script>
</body>
</html>
